{%- comment -%}
  QR for https://medkit.1bit2bit.dev, generated once and checked in: the URL is
  fixed, so a build-time generator would be a gem dependency for a constant.

  Version 2 (25 modules), error correction Q, encoded uppercase. The URL is
  scheme- and host-only, and both are case-insensitive, so uppercasing it lets
  the payload use alphanumeric mode instead of byte mode — that buys the jump
  from 7% to 25% error correction at the same 25-module size, which is what a
  code this small, printed and then folded into a wallet, needs.

  The viewBox includes the mandatory four-module quiet zone, so the whole
  graphic is the scannable unit and CSS only has to set its width.
{%- endcomment -%}
