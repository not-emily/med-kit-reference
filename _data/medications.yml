categories:
  - id: 1
    name: Pain + Fever
    short_name: Pain + Fever
    medications:
      - id: 1a
        name: Advil
        ingredient: Ibuprofen 200 mg
        take:
          - Take 1 tablet every 4–6 hours while symptoms persist.
          - If pain or fever does not respond to 1 tablet, 2 may be used.
        max: Do not exceed 6 tablets in 24 hours.
        warnings: []
        uses: Minor aches and pains, fever reduction

      - id: 1b
        name: Tylenol
        ingredient: Acetaminophen 500 mg
        take:
          - Take 2 gelcaps every 6 hours while symptoms last.
        max: Do not take more than 6 gelcaps in 24 hours.
        warnings:
          - Do not use for more than 10 days.
          - Do not use with other medicines containing acetaminophen.
          - Extra strength, rapid-release gels.
        uses: Minor aches and pains, fever reduction

      - id: 1c
        name: Excedrin Migraine
        ingredient: Acetaminophen 250 mg, Aspirin 250 mg, Caffeine 65 mg
        take:
          - Take 2 caplets with a glass of water.
        max: Do not take more than 2 caplets in 24 hours.
        warnings:
          - Do not use for 10 or more days per month.
          - "Under 18 years old: ask a doctor."
        uses: Migraine

  - id: 2
    name: Digestive
    short_name: Digestive
    medications:
      - id: 2a
        name: Dulcolax
        ingredient: Bisacodyl (USP) 5 mg
        take:
          - Take 1–3 tablets in a single daily dose with a full glass of water.
        max: ""
        warnings:
          - Do not use within 1 hour after taking an antacid or milk.
          - Do not chew or crush tablets.
        uses: Constipation (relief in 6–12 hours)

      - id: 2b
        name: Imodium
        ingredient: Loperamide Hydrochloride 2 mg
        take:
          - Take 2 caplets after the first loose stool.
          - Take 1 caplet after each subsequent loose stool.
        max: Do not take more than 3 caplets in 24 hours.
        warnings:
          - Drink plenty of clear fluids to help prevent dehydration caused by diarrhea.
        uses: Diarrhea

  - id: 3
    name: Nausea + Heartburn
    short_name: Nausea + Heartburn
    medications:
      - id: 3a
        name: Dramamine
        ingredient: Meclizine Hydrochloride 25 mg
        take:
          - Take 1–2 tablets once daily.
          - Take first dose ½ to 1 hour before starting activity.
        max: ""
        warnings:
          - Drowsiness may occur.
        uses: Nausea, vomiting, dizziness

      - id: 3b
        name: TUMS
        ingredient: Calcium Carbonate
        take:
          - Chew 2–3 tablets as symptoms occur.
        max: Do not take more than 7 tablets in 24 hours (5 if pregnant).
        warnings:
          - Do not take for symptoms that persist for more than 2 weeks.
        uses: Heartburn, sour stomach, acid indigestion, upset stomach

  - id: 4
    name: Cold + Flu
    short_name: Cold + Flu
    medications:
      - id: 4a
        name: Cough Drops
        ingredient: Menthol 5.8 mg
        take:
          - Dissolve 1 drop slowly in the mouth.
          - Repeat every 2 hours as needed.
        max: ""
        warnings: []
        uses: Cough, irritated or sore throat

      - id: 4b
        name: DayQuil
        ingredient: Acetaminophen 325 mg, Dextromethorphan HBr 10 mg, Phenylephrine HCl 5 mg
        take:
          - DOSING TO BE ADDED FROM CURRENT PRODUCT LABEL.
        max: ""
        warnings: []
        uses: Headache, fever, sore throat, minor aches and pains, nasal congestion, sinus pressure, cough

      - id: 4c
        name: NyQuil
        ingredient: Acetaminophen 325 mg, Dextromethorphan HBr 15 mg, Doxylamine succinate 6.25 mg
        take:
          - DOSING TO BE ADDED FROM CURRENT PRODUCT LABEL.
        max: ""
        warnings: []
        uses: Headache, fever, sore throat, minor aches and pains, sneezing, runny nose, cough

  - id: 5
    name: Allergy
    short_name: Allergy
    medications:
      - id: 5a
        name: Benadryl
        ingredient: Diphenhydramine HCl 25 mg
        take:
          - Take 1–2 tablets every 4–6 hours.
        max: Do not take more than 6 times in 24 hours.
        warnings:
          - Drowsiness may occur.
        uses: Sneezing, runny nose, itchy throat, itchy/watery eyes, hay fever, upper respiratory allergies, common cold

  - id: 6
    name: Heat Exhaustion
    short_name: Heat Exhaustion
    medications:
      - id: 6a
        name: Medi-lyte
        ingredient: Calcium 10.8 mg, Potassium 40 mg, Magnesium 12 mg
        take:
          - Take 2 tablets as needed with a full glass of water.
          - Repeat every hour as needed.
        max: Do not exceed 20 tablets in 24 hours.
        warnings: []
        uses: Heat fatigue, muscle cramps, heat exhaustion, replaces lost electrolytes, helps provide rapid rehydration
